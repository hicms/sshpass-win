name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version and has release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          . ./scripts/common.ps1
          $root = (Get-Location).Path
          $crate = Get-CargoVersion $root
          if ($env:TAG -ne "v$crate") {
            throw "Tag $env:TAG does not match Cargo.toml version $crate"
          }
          $notes = Get-ReleaseNotesPath $root $env:TAG
          if (-not (Test-Path $notes)) {
            throw "Missing release notes: $notes"
          }

      - name: Check and build
        shell: pwsh
        run: ./scripts/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: sshpass
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sshpass
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: sshpass ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/sshpass.exe
            dist/sshpass.exe.sha256
