[package]
name = "sshpass"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Non-interactive ssh password auth for Windows, driven through a pseudo console (ConPTY)"
license = "Apache-2.0"
readme = "README.md"
publish = false

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[[test]]
name = "e2e"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
